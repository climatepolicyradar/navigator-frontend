# Which Pulumi stack a change affects, used by the `changes` job in
# pull_request.yml so the paths are defined once.
#
# A filter name matches the `project` key of an entry in
# .github/projects.json. Only the stacks whose filter matched are previewed.
#
# `frontend` is an anchor, not a stack: the program and dependencies shared by
# every theme's stack. It never appears in projects.json, so it is ignored.

frontend: &frontend
  - infra/__main__.py
  - infra/pyproject.toml
  - infra/uv.lock

# The per-theme Pulumi.<theme>-<environment>.yaml is the only theme-specific
# input, so a theme's stack is previewed only when its own config changes.
staging-frontend-cpr:
  - infra/Pulumi.cpr-staging.yaml
  - *frontend

staging-frontend-mcf:
  - infra/Pulumi.mcf-staging.yaml
  - *frontend

staging-frontend-cclw:
  - infra/Pulumi.cclw-staging.yaml
  - *frontend

staging-frontend-ccc:
  - infra/Pulumi.ccc-staging.yaml
  - *frontend

staging-shared-resources:
  - infra/platform/**

staging-observability:
  - infra/observability/**

production-frontend-cpr:
  - infra/Pulumi.cpr-production.yaml
  - *frontend

production-frontend-mcf:
  - infra/Pulumi.mcf-production.yaml
  - *frontend

production-frontend-cclw:
  - infra/Pulumi.cclw-production.yaml
  - *frontend

production-frontend-ccc:
  - infra/Pulumi.ccc-production.yaml
  - *frontend

production-shared-resources:
  - infra/platform/**

production-observability:
  - infra/observability/**

# Faro apps aren't per-environment, so there is a single production stack.
production-faro:
  - infra/faro/**
