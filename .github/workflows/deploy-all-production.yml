name: Deploy all to production
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-production:
    strategy:
      matrix:
        theme: [cpr, cclw, mcf, ccc]
    name: Deploy ${{ github.sha }} to ${{ matrix.theme }} production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "This workflow can only be run from main."
          exit 1
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-new-frontend-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: eu-west-1

      - name: Login to Amazon ECR (production)
        id: login-ecr-production
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Build, tag, and push to ECR with 'latest' tag
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: latest
          AWS_REGION: eu-west-1
          ECR_REPOSITORY: navigator-frontend-${{ matrix.theme }}
          THEME: ${{ matrix.theme }}
        # @related: GITHUB_SHA_ENV_VAR
        run: |
          docker build --build-arg THEME=${THEME} --build-arg NEXT_STATIC_ENABLED=true --build-arg NEXT_PUBLIC_FARO_ENVIRONMENT=production --build-arg GITHUB_SHA=$(git rev-parse HEAD) -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Serve this build's JS/CSS from S3 so a client mid-session on the old
      # build can still fetch its chunks after the deploy below replaces the
      # container. Must run before that deploy, or those requests 404.
      - name: Extract static assets from built image
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker create "$IMAGE")
          mkdir -p ./next-static
          # The trailing /. copies the directory *contents*. Without it, docker
          # cp nests under ./next-static/static when the target already exists,
          # which would publish every asset one level too deep.
          docker cp "$CONTAINER_ID":/app/.next/static/. ./next-static
          docker rm "$CONTAINER_ID"
          if [ -z "$(find ./next-static -type f -print -quit)" ]; then
            echo "::error::No static assets extracted from $IMAGE; refusing to deploy"
            exit 1
          fi

      - name: Upload static assets to S3
        env:
          BUCKET_NAME: ${{ matrix.theme }}-frontend-production-next-static
        run: |
          set -euo pipefail
          # No --delete: these paths are per-build content hashes and must
          # outlive the container that shipped them, for clients still holding
          # the old HTML. The bucket lifecycle rule expires them instead.
          aws s3 sync ./next-static "s3://${BUCKET_NAME}/_next/static/" \
            --cache-control "public,max-age=31536000,immutable"

      # Runs after assets are uploaded, not on merge to main: pulumi up can
      # change the CloudFront behaviour that routes /_next/static/* to this
      # theme's S3 bucket, which is only safe once that bucket holds the
      # assets for the build about to go live (uploaded above). It also runs
      # before the ECS deploy below, so that deploy lands on infra (target
      # groups, alarms, etc.) pulumi has already finished updating.
      - name: Configure AWS credentials (infra)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-infra-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC_production
          aws-region: eu-west-1

      - uses: astral-sh/setup-uv@v7

      - name: Install pulumi
        uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Install infra dependencies
        working-directory: infra
        run: uv sync

      - name: Pulumi up (production ${{ matrix.theme }})
        working-directory: infra
        run: pulumi up --yes --skip-preview --stack climatepolicyradar/frontend/${{ matrix.theme }}-production
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DEPLOY_TO_PROD_STACK_ALLOWED: true

      # pulumi up above re-configured credentials to the infra role; the ECS
      # deploy needs the frontend deploy role instead.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-new-frontend-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: eu-west-1

      # Replaces aws-actions/amazon-ecs-deploy-express-service: the RollbackAlarm
      # correction must land between starting the deployment and waiting on it,
      # and that action blocks until the deployment finishes. Verification of
      # the deployment outcome moved into the script. See the script header.
      - name: Deploy to ECS (production)
        run: >
          .github/workflows/scripts/deploy_ecs_express.sh
          frontend-production ${{ matrix.theme }}-frontend-production ${{ steps.build-image.outputs.image }}
