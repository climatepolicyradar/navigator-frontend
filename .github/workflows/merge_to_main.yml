name: Merge to main
on:
  push:
    branches:
      - main
      - push-to-ecrt

# trunk-ignore(checkov/CKV2_GHA_1)
permissions: write-all
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-observability-pulumi-up: ${{ steps.filter.outputs.run-observability-pulumi-up }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run-observability-pulumi-up:
              - 'infra/observability/**'
  # Faro apps aren't per-environment (see infra/faro/__main__.py's allowed_origins),
  # so there's a single production stack shared by staging, production, and review
  # deploys alike, rather than a staging/production pair like the other infra
  # projects.
  # Needs no AWS credentials -- it only talks to Grafana.
  pulumi-up-faro:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        working-directory: infra/faro
        run: uv sync
      - name: Pulumi up
        working-directory: infra/faro
        run: pulumi up --yes --skip-preview --stack climatepolicyradar/frontend-faro/production
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Generate tsconfig.json
        run: |
          cp tsconfig.base.json tsconfig.json
          sed -i "s/__THEME__/$THEME/g" tsconfig.json
      - run: npm install
      - uses: trunk-io/trunk-action@v1
        with:
          arguments: --ci

  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: cp .env.example .env
      - name: Generate tsconfig.json
        run: |
          cp tsconfig.base.json tsconfig.json
          sed -i "s/__THEME__/$THEME/g" tsconfig.json
        env:
          THEME: cpr
      - name: Run vitest - core functionality
        run: npm run test
        # This is needed to pass the results on to the trunk-io/analytics-uploader
        continue-on-error: true
        env:
          THEME: cpr

      - name: Run vitest - new features
        run: npm run test
        # This is needed to pass the results on to the trunk-io/analytics-uploader
        continue-on-error: true
        env:
          THEME: cpr
          E2E_TEST_FEATURE_FLAGS: true

      - name: Upload vitest results to Trunk.io
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: "**/vitest.xml"
          token: ${{ secrets.TRUNK_TOKEN }}
          org-slug: ${{ secrets.TRUNK_ORG_SLUG }}

  # Deploy to staging (per-theme build, push, and ECS deploy)
  deploy-staging:
    # Needs pulumi-up-faro: it reads frontend-faro/production's stack output,
    # so a push that changes the frontend stack needs to land first or it
    # reads stale/missing output.
    needs: [code-quality, test, pulumi-up-faro]
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  observability-pulumi-up:
    uses: ./.github/workflows/pulumi_up.yml
    secrets: inherit
    needs: [changes]
    if: needs.changes.outputs.run-observability-pulumi-up == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    with:
      environment: ${{ matrix.environment }}
      working-directory: ./infra/observability
      stack: climatepolicyradar/frontend-observability/${{ matrix.environment }}
      # Grafana only - no AWS resources in this project, so no role to assume.
      aws-role: ""

  # Deploy Storybook
  storybook:
    runs-on: ubuntu-latest
    env:
      THEME: cpr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - name: Generate tsconfig.json
        run: |
          cp tsconfig.base.json tsconfig.json
          sed -i "s/__THEME__/$THEME/g" tsconfig.json
      - run: npm install
      - run: npm run build-storybook
      - name: Upload to S3
        run: |
          aws s3 sync --delete ./storybook-static s3://storybook.climatepolicyradar.org
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
