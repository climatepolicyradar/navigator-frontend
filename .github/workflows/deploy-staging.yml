name: Deploy to staging
on:
  # a. Auto deploy once the merge-to-main action is completed successfully
  workflow_run:
    workflows: [Merge to main]
    types:
      - completed
    branches:
      - main
  # b. Allow deployment from the actions tab - this allows feature branch deployment
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  # Check if we have any infra changes, so pulumi up below only runs for
  # stacks this push actually touched.
  changes:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      projects: ${{ steps.parse.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: base-sha
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base-sha.outputs.sha }}
          filters: |
            staging-frontend-cpr:
              - 'infra/Pulumi.cpr-staging.yaml'
              - 'infra/__main__.py'

            staging-frontend-mcf:
              - 'infra/Pulumi.mcf-staging.yaml'
              - 'infra/__main__.py'

            staging-frontend-cclw:
              - 'infra/Pulumi.cclw-staging.yaml'
              - 'infra/__main__.py'

            staging-frontend-ccc:
              - 'infra/Pulumi.ccc-staging.yaml'
              - 'infra/__main__.py'

            staging-shared-resources:
              - 'infra/platform/**'

            staging-observability:
              - 'infra/observability/**'

      - id: parse
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          CHANGES=${CHANGES:-[]}
          echo "projects=$(echo "$CHANGES" | jq -c '.')" >> "$GITHUB_OUTPUT"

  # infra/platform/** has no per-theme deploy step to run alongside, so it
  # keeps its own pulumi up here rather than joining the matrix below.
  pulumi-up-shared-resources:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'staging-shared-resources')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v7
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-infra-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC_staging
          aws-region: eu-west-1
      - name: Install dependencies
        working-directory: infra/platform
        run: uv sync
      - name: Pulumi up
        working-directory: infra/platform
        run: pulumi up --yes --skip-preview --stack climatepolicyradar/frontend-platform/staging
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # Runs independently of the per-theme deploys below, and deliberately after
  # nothing: synthetic checks must never sit in the critical path of shipping
  # the site. Needs no AWS credentials -- it only talks to Grafana and reads the
  # frontend stacks' outputs from the Pulumi backend.
  pulumi-up-observability:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'staging-observability')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        working-directory: infra/observability
        run: uv sync
      - name: Pulumi up
        working-directory: infra/observability
        run: pulumi up --yes --skip-preview --stack climatepolicyradar/frontend-observability/staging
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  deploy-staging:
    needs: changes
    name: Deploy ${{ github.sha }} to staging ${{ matrix.theme }}
    strategy:
      matrix:
        theme: [cpr, cclw, mcf, ccc]

    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-new-frontend-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: eu-west-1

      - name: Login to Amazon ECR (staging)
        id: login-ecr-staging
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Read Faro collector endpoint
        id: faro
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          echo "collector_endpoint=$(pulumi stack output ${{ matrix.theme }}_faro_collector_endpoint --stack climatepolicyradar/frontend-faro/production --non-interactive)" >> "$GITHUB_OUTPUT"

      # Each theme has its own Faro app in Grafana Cloud, so its source-map-upload
      # app ID differs per theme (see infra/faro/__main__.py); GitHub Actions can't
      # index secrets.* dynamically by matrix.theme, so all four are passed in here
      # and selected via jq below.
      - name: Select Faro source map app ID
        id: faro-sourcemap
        env:
          APP_IDS: >-
            {
              "cpr": "${{ secrets.FARO_SOURCEMAP_APP_ID_CPR }}",
              "cclw": "${{ secrets.FARO_SOURCEMAP_APP_ID_CCLW }}",
              "mcf": "${{ secrets.FARO_SOURCEMAP_APP_ID_MCF }}",
              "ccc": "${{ secrets.FARO_SOURCEMAP_APP_ID_CCC }}"
            }
        run: |
          echo "app_id=$(echo "$APP_IDS" | jq -r '.["${{ matrix.theme }}"]')" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push to ECR with 'latest' tag
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: latest
          AWS_REGION: eu-west-1
          ECR_REPOSITORY: navigator-frontend-${{ matrix.theme }}
          THEME: ${{ matrix.theme }}
        # @related: GITHUB_SHA_ENV_VAR
        run: |
          docker build --build-arg THEME=${THEME} --build-arg NEXT_PUBLIC_FARO_ENVIRONMENT=staging --build-arg GITHUB_SHA=$(git rev-parse HEAD) \
            --build-arg NEXT_PUBLIC_FARO_URL=${{ steps.faro.outputs.collector_endpoint }} \
            --build-arg FARO_SOURCEMAP_API_KEY=${{ secrets.FARO_SOURCEMAP_API_KEY }} \
            --build-arg FARO_SOURCEMAP_APP_ID=${{ steps.faro-sourcemap.outputs.app_id }} \
            --build-arg FARO_SOURCEMAP_STACK_ID=${{ secrets.FARO_SOURCEMAP_STACK_ID }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Serve this build's JS/CSS from S3 so a client mid-session on the old
      # build can still fetch its chunks after the deploy below replaces the
      # container. Must run before that deploy, or those requests 404.
      - name: Extract static assets from built image
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker create "$IMAGE")
          mkdir -p ./next-static
          # The trailing /. copies the directory *contents*. Without it, docker
          # cp nests under ./next-static/static when the target already exists,
          # which would publish every asset one level too deep.
          docker cp "$CONTAINER_ID":/app/.next/static/. ./next-static
          docker rm "$CONTAINER_ID"
          if [ -z "$(find ./next-static -type f -print -quit)" ]; then
            echo "::error::No static assets extracted from $IMAGE; refusing to deploy"
            exit 1
          fi

      - name: Upload static assets to S3
        env:
          BUCKET_NAME: ${{ matrix.theme }}-frontend-staging-next-static
        run: |
          set -euo pipefail
          # No --delete: these paths are per-build content hashes and must
          # outlive the container that shipped them, for clients still holding
          # the old HTML. The bucket lifecycle rule expires them instead.
          aws s3 sync ./next-static "s3://${BUCKET_NAME}/_next/static/" \
            --cache-control "public,max-age=31536000,immutable"

      # Only runs when this theme's stack actually changed. Placed after the
      # S3 upload and before the ECS deploy, same reasoning as production:
      # pulumi up can change CloudFront's routing to this bucket, which is
      # only safe once the bucket holds the assets going live (uploaded
      # above), and the ECS deploy should land on infra pulumi already
      # finished updating.
      - name: Configure AWS credentials (infra)
        if: contains(fromJSON(needs.changes.outputs.projects), format('staging-frontend-{0}', matrix.theme))
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-infra-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC_staging
          aws-region: eu-west-1

      - uses: astral-sh/setup-uv@v7
        if: contains(fromJSON(needs.changes.outputs.projects), format('staging-frontend-{0}', matrix.theme))

      - name: Install pulumi
        if: contains(fromJSON(needs.changes.outputs.projects), format('staging-frontend-{0}', matrix.theme))
        uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Install infra dependencies
        if: contains(fromJSON(needs.changes.outputs.projects), format('staging-frontend-{0}', matrix.theme))
        working-directory: infra
        run: uv sync

      - name: Pulumi up (staging ${{ matrix.theme }})
        if: contains(fromJSON(needs.changes.outputs.projects), format('staging-frontend-{0}', matrix.theme))
        working-directory: infra
        run: pulumi up --yes --skip-preview --stack climatepolicyradar/frontend/${{ matrix.theme }}-staging
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # pulumi up above may have re-configured credentials to the infra role;
      # the ECS deploy needs the frontend deploy role instead.
      - name: Configure AWS credentials
        if: contains(fromJSON(needs.changes.outputs.projects), format('staging-frontend-{0}', matrix.theme))
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-new-frontend-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: eu-west-1

      # Replaces aws-actions/amazon-ecs-deploy-express-service: the RollbackAlarm
      # correction must land between starting the deployment and waiting on it,
      # and that action blocks until the deployment finishes. Verification of
      # the deployment outcome moved into the script. See the script header.
      - name: Deploy to ECS (staging ${{ matrix.theme }})
        run: >
          .github/workflows/scripts/deploy_ecs_express.sh
          frontend-staging ${{ matrix.theme }}-frontend-staging ${{ steps.build-image.outputs.image }}
