# trunk-ignore-all(checkov/CKV2_GHA_1)
name: Test redirects

# Runs whenever a theme's redirects.json changes: deploys (or refreshes) that
# theme's review stack directly via deploy-review-stack.yml's workflow_call
# entry point - independent of whether the PR carries the deploy:dev label -
# then live-checks the redirects this PR added or changed against it.
#
# Note: this means touching themes/*/redirects.json causes a real Pulumi
# deployment on every push to the PR, even without deploy:dev applied.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - themes/*/redirects.json

env:
  ORG: climatepolicyradar
  PROJECT: frontend

jobs:
  changed-theme:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      themes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpr:
              - 'themes/cpr/redirects.json'
            mcf:
              - 'themes/mcf/redirects.json'
            cclw:
              - 'themes/cclw/redirects.json'
            ccc:
              - 'themes/ccc/redirects.json'

  deploy-review-stack:
    needs: changed-theme
    if: fromJSON(needs.changed-theme.outputs.themes)[0] != null
    permissions:
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.changed-theme.outputs.themes) }}
    uses: ./.github/workflows/deploy-review-stack.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      theme: ${{ matrix.theme }}
    secrets: inherit

  check:
    needs: [changed-theme, deploy-review-stack]
    if: >-
      always() && fromJSON(needs.changed-theme.outputs.themes)[0] != null
      && needs.deploy-review-stack.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.changed-theme.outputs.themes) }}
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      FILE: themes/${{ matrix.theme }}/redirects.json
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pulumi/actions@v7

      - name: Fetch ${{ matrix.theme }} review stack URL
        id: url
        env:
          STACK_NAME: pr-${{ matrix.theme }}-navigator-frontend-${{ github.event.pull_request.number }}
        run: |
          review_url=$(pulumi stack output ecs_service_url --stack "${ORG}/${PROJECT}/${STACK_NAME}")
          echo "review_url=${review_url:?is empty - ${STACK_NAME} did not deploy}" >> "$GITHUB_OUTPUT"

      - name: Find redirects added or changed in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base HEAD "$BASE_SHA")
          git show "$base:$FILE" > base.json
          jq -s '.[0] - .[1]' "$FILE" base.json > changed.json
          echo "Checking $(jq length changed.json) of $(jq length "$FILE") redirects"

      - name: Fail if a source maps to conflicting destinations
        run: |
          conflicts=$(jq -r '
            map(select(has("has") or has("missing") or (.source | contains(":")) | not))
            | group_by(.source)[]
            | select(unique_by(.destination) | length > 1)
            | .[0].source
          ' "$FILE")
          [ -z "$conflicts" ] || { echo "A source maps to more than one destination:"; echo "$conflicts"; exit 1; }

      - run: |
          node scripts/check-redirects.mjs \
            --base-url "${{ steps.url.outputs.review_url }}" \
            --file changed.json

  teardown:
    needs: [changed-theme, deploy-review-stack, check]
    # The review stack this workflow creates exists only as a fixture for the
    # check above, so it is destroyed as soon as the check is done rather than
    # lingering until the PR closes. `always()` matters here as a failing check
    # means a PR sits open for days, so the teardown must not be skipped.
    #
    # deploy-review-stack.yml's own destroy path can't cover this. It is
    # reached via the `closed` pull_request event, whereas this stack is
    # created through workflow_call, where `is_workflow_call` short-circuits
    # the action to `update` so will never reach the destroy branch.
    if: always() && fromJSON(needs.changed-theme.outputs.themes)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.changed-theme.outputs.themes) }}
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - name: Trigger destroy deployment
        env:
          STACK_NAME: pr-${{ matrix.theme }}-navigator-frontend-${{ github.event.pull_request.number }}
        run: |
          # Check if the stack exists before attempting destroy - the deploy
          # job may have failed before creating it.
          stack_status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
            "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}/${STACK_NAME}")

          if [ "$stack_status" -eq 404 ]; then
            echo "Stack ${STACK_NAME} does not exist, nothing to destroy"
            exit 0
          fi

          response=$(curl -fsSL -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}/${STACK_NAME}/deployments" \
            -d "{
              \"operation\": \"destroy\",
              \"inheritSettings\": true,
              \"operationContext\": {
                \"options\": {
                  \"deleteAfterDestroy\": true
                }
              }
            }")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "Destroy triggered: HTTP $status"
          echo "$body" | jq .
