name: Pull request
on: pull_request
permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
      THEME: cpr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Generate tsconfig.json
        run: |
          cp tsconfig.base.json tsconfig.json
          sed -i "s/__THEME__/cpr/g" tsconfig.json
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    runs-on: ubuntu-latest
    env:
      THEME: cpr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Generate tsconfig.json
        run: |
          cp tsconfig.base.json tsconfig.json
          sed -i "s/__THEME__/$THEME/g" tsconfig.json
      - uses: trunk-io/trunk-action@v1
        with:
          arguments: --ci
      - run: npm run type-check

    permissions:
      # For trunk to post annotations
      checks: write
      # For repo checkout
      contents: read

  test-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run-tests:
              - 'src/**'
              - 'themes/**'
              - 'tests/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.js'
              - 'next.config.test.ts'
              - 'playwright.config.ts'
              - 'tsconfig.base.json'
              - '.env.example'
              - '.nvmrc'
              - '.github/workflows/pull_request.yml'

  test:
    needs: test-changes
    if: needs.test-changes.outputs.run-tests == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: cp .env.example .env
      - name: Generate tsconfig.json
        run: |
          cp tsconfig.base.json tsconfig.json
          sed -i "s/__THEME__/$THEME/g" tsconfig.json
        env:
          THEME: cpr
      - name: Run vitest - core functionality
        # Failure doesn't stop the job here so results still reach the trunk-io/analytics-uploader step below;
        # the "Fail job if tests failed" step at the end enforces the real pass/fail outcome.
        run: npm run test || echo "TESTS_FAILED=true" >> "$GITHUB_ENV"
        env:
          THEME: cpr

      - name: Run vitest - new features
        run: npm run test || echo "TESTS_FAILED=true" >> "$GITHUB_ENV"
        env:
          THEME: cpr
          E2E_TEST_FEATURE_FLAGS: true

      - name: Upload vitest results to Trunk.io
        if: always()
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: "**/vitest.xml"
          token: ${{ secrets.TRUNK_TOKEN }}
          org-slug: ${{ secrets.TRUNK_ORG_SLUG }}

      - name: Fail job if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1

  test-e2e:
    needs: test-changes
    if: needs.test-changes.outputs.run-tests == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: $HOME/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        theme: [cpr, cclw, mcf, ccc]
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm i

      - run: cp .env.example .env

      - name: Generate tsconfig.json
        run: |
          cp tsconfig.base.json tsconfig.json
          sed -i "s/__THEME__/${{ matrix.theme }}/g" tsconfig.json

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.theme }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.theme }}-${{ hashFiles('**/package-lock.json') }}-

      - run: THEME=${{ matrix.theme }} npm run build
        env:
          NODE_ENV: production

      - name: Copy static assets to standalone
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        timeout-minutes: 5

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        timeout-minutes: 2
        continue-on-error: true

      - name: Verify Playwright Installation
        run: npx playwright install chromium --dry-run || npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        timeout-minutes: 3

      - name: Run Tests - core functionality
        # Failure doesn't stop the job here so results still reach the trunk-io/analytics-uploader step below;
        # the "Fail job if tests failed" step at the end enforces the real pass/fail outcome.
        env:
          THEME: ${{ matrix.theme }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        run: npx playwright test tests/${{ matrix.theme }}/ --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} || echo "TESTS_FAILED=true" >> "$GITHUB_ENV"

      - name: Run Tests - new features
        env:
          THEME: ${{ matrix.theme }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          E2E_TEST_FEATURE_FLAGS: true
        run: npx playwright test tests/${{ matrix.theme }}/ --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} || echo "TESTS_FAILED=true" >> "$GITHUB_ENV"

      - name: Upload Test Results to Trunk.io
        if: always()
        uses: trunk-io/analytics-uploader@v2
        env:
          THEME: ${{ matrix.theme }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        with:
          junit-paths: test-results-${{ matrix.theme }}/playwright.xml
          token: ${{ secrets.TRUNK_TOKEN }}
          org-slug: ${{ secrets.TRUNK_ORG_SLUG }}

      - name: Fail job if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1

  tests:
    name: Tests
    needs: [test, test-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
            echo "test job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          if [[ "${{ needs.test-e2e.result }}" != "success" && "${{ needs.test-e2e.result }}" != "skipped" ]]; then
            echo "test-e2e job did not succeed: ${{ needs.test-e2e.result }}"
            exit 1
          fi

  dependabot:
    name: Dependabot Auto-pilot
    needs: [code-quality, test-changes, test, test-e2e]
    if: |
      always() &&
      needs.code-quality.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    permissions:
      pull-requests: write
      contents: write
    uses: climatepolicyradar/reusable-workflows/.github/workflows/dependabot-autopilot.yml@v23
    with:
      auto-approve: false

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The matrix for pulumi-preview: one entry per stack the change affects.
      # `[]` when the change touches no stack.
      include: ${{ steps.matrix.outputs.include }}
    steps:
      # paths-filter reads .github/filters.yml from the working tree, so the
      # repository has to be checked out first.
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml

      - name: Build the matrix from the changed stacks
        id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          # Each filter name in filters.yml matches the `project` of an entry
          # in projects.json, which says where the stack lives. Filters with
          # no entry (the shared path anchors) are dropped here. Adding a
          # stack is an edit to those two files; nothing in this workflow
          # changes.
          include="$(jq -c --argjson changed "${CHANGED:-[]}" '
            [ .[] | select(.project as $p | $changed | index($p)) ]
          ' .github/projects.json)"
          echo "include=${include}" >>"$GITHUB_OUTPUT"
          echo "Previewing: ${include}"

  pulumi-preview:
    needs: changes
    # Without this the job still runs once with every matrix value unset.
    if: needs.changes.outputs.include != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.include) }}
    environment: ${{ matrix.environment }}
    env:
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v7

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-infra-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
          # Off by default, so the account id and the assumed ARN would
          # otherwise appear in this step's log.
          mask-aws-account-id: true

      - uses: astral-sh/setup-uv@v7

      - name: Install pulumi
        uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ matrix.work-dir }}
        run: uv sync

      - name: Pulumi preview
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: ${{ matrix.stack-name }}
          work-dir: ${{ matrix.work-dir }}
          diff: true
          always-include-summary: true
          suppress-outputs: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DEPLOY_FROM_MAIN_BRANCH_ONLY: false
          DEPLOY_TO_PROD_STACK_ALLOWED: true
