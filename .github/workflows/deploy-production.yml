name: Deploy to production
on:
  workflow_dispatch:
    inputs:
      # This is a gated deploy workflow.
      # User inputs are intentional and protected by:
      # 1. Limited theme choices
      # 2. Only deploying existing images
      # trunk-ignore(checkov/CKV_GHA_7)
      theme:
        description: Theme to deploy
        type: choice
        required: true
        options:
          - cpr
          - cclw
          - mcf
          - ccc

permissions:
  id-token: write
  contents: read

jobs:
  deploy-production:
    name: Deploy ${{ github.sha }} to ${{ inputs.theme }} production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "This workflow can only be run from main."
          exit 1
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/navigator-new-frontend-github-actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: eu-west-1

      - name: Login to Amazon ECR (production)
        id: login-ecr-production
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Build, tag, and push to ECR with 'latest' tag
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: latest
          AWS_REGION: eu-west-1
          ECR_REPOSITORY: navigator-frontend-${{ inputs.theme }}
          THEME: ${{ inputs.theme }}
        # @related: GITHUB_SHA_ENV_VAR
        run: |
          docker build --build-arg THEME=${THEME} --build-arg GITHUB_SHA=$(git rev-parse HEAD) -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Serve this build's JS/CSS from S3 so a client mid-session on the old
      # build can still fetch its chunks after the deploy below replaces the
      # container. Must run before that deploy, or those requests 404.
      - name: Extract static assets from built image
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker create "$IMAGE")
          mkdir -p ./next-static
          # The trailing /. copies the directory *contents*. Without it, docker
          # cp nests under ./next-static/static when the target already exists,
          # which would publish every asset one level too deep.
          docker cp "$CONTAINER_ID":/app/.next/static/. ./next-static
          docker rm "$CONTAINER_ID"
          if [ -z "$(find ./next-static -type f -print -quit)" ]; then
            echo "::error::No static assets extracted from $IMAGE; refusing to deploy"
            exit 1
          fi

      - name: Upload static assets to S3
        env:
          BUCKET_NAME: cpr-production-${{ inputs.theme }}-next-static
        run: |
          set -euo pipefail
          # No --delete: these paths are per-build content hashes and must
          # outlive the container that shipped them, for clients still holding
          # the old HTML. The bucket lifecycle rule expires them instead.
          aws s3 sync ./next-static "s3://${BUCKET_NAME}/_next/static/" \
            --cache-control "public,max-age=31536000,immutable"

      # @see: https://github.com/marketplace/actions/amazon-ecs-deploy-express-service-action-for-github-actions#complete-example-with-all-options
      - name: Deploy to ECS (production)
        id: deploy-production
        uses: aws-actions/amazon-ecs-deploy-express-service@v1.2.2
        with:
          cluster: frontend-production
          service-name: ${{ inputs.theme }}-frontend-production
          image: ${{ steps.build-image.outputs.image }}
          execution-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/frontend-production-ecs-task-execution-role
          infrastructure-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/frontend-production-ecs-task-infrastructure-role

      - name: Verify production deployment outcome
        env:
          SERVICE_ARN: ${{ steps.deploy-production.outputs.service-arn }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICE_ARN}" ]]; then
            echo "::error::deploy step did not emit a service-arn output"
            exit 1
          fi
          DEPLOY_ARN=$(aws ecs list-service-deployments \
            --cluster frontend-production \
            --service "${SERVICE_ARN}" \
            --query 'serviceDeployments[0].serviceDeploymentArn' \
            --output text)
          if [[ -z "${DEPLOY_ARN}" || "${DEPLOY_ARN}" == "None" ]]; then
            echo "::error::Could not find a service deployment for ${SERVICE_ARN}"
            exit 1
          fi
          STATUS=$(aws ecs describe-service-deployments \
            --service-deployment-arns "${DEPLOY_ARN}" \
            --query 'serviceDeployments[0].status' \
            --output text)
          echo "Deployment ${DEPLOY_ARN} final status: ${STATUS}"
          if [[ "${STATUS}" != "SUCCESSFUL" ]]; then
            echo "::error::Deployment did not succeed (status=${STATUS})"
            exit 1
          fi
