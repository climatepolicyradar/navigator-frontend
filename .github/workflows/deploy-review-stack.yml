# trunk-ignore-all(checkov/CKV2_GHA_1)
name: Deploy review stack

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
    branches: [main]
  # When this workflow is called by e.g. test-redirects.yml - you need to specify
  # the `pr_number` as labelling it with `dev:deploy` would not kick of this workflow
  # as GitHub doesn't chain workflow runs off `GITHUB_TOKEN` events, and `github.event.pull_request.number`
  # is not available.
  # We only support 1 theme for now, as we only support 1 output review_url
  workflow_call:
    inputs:
      pr_number:
        description: PR number to deploy a review stack for
        required: true
        type: number
      theme:
        description: Theme to deploy (cpr, cclw, mcf, or ccc)
        required: true
        type: string
    outputs:
      review_url:
        description: The deployed review stack's URL
        value: ${{ jobs.review-stack.outputs.review_url }}

jobs:
  setup:
    # Computes is_workflow_call/pr_number/themes once so every downstream
    # context (concurrency, strategy.matrix, steps) can read the same values
    # via needs.setup.outputs instead of repeating this check in each spot.
    runs-on: ubuntu-latest
    outputs:
      is_workflow_call: ${{ steps.vars.outputs.is_workflow_call }}
      pr_number: ${{ steps.vars.outputs.pr_number }}
      themes: ${{ steps.vars.outputs.themes }}
    steps:
      - name: Compute is_workflow_call, pr_number and themes
        id: vars
        env:
          IS_WORKFLOW_CALL: ${{ inputs.theme != '' }}
          PR_NUMBER: ${{ inputs.theme != '' && inputs.pr_number || github.event.pull_request.number }}
          THEMES: ${{ inputs.theme != '' && format('["{0}"]', inputs.theme) || '["cpr", "cclw", "mcf", "ccc"]' }}
        run: |
          echo "is_workflow_call=$IS_WORKFLOW_CALL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "themes=$THEMES" >> "$GITHUB_OUTPUT"

  review-stack:
    needs: setup
    permissions:
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    # Both this workflow and use-search-api.yml can trigger a Pulumi
    # deployment against the same pr-<theme>-navigator-frontend-<PR> stack.
    # Sharing this group (same key in both files) means a newer deployment
    # for the same PR+theme cancels a stale one still in flight, instead of
    # the two queueing behind each other on the Pulumi side where a wait
    # step elsewhere can time out waiting for its turn.
    concurrency:
      group: review-stack-${{ matrix.theme }}-${{ needs.setup.outputs.pr_number }}
      cancel-in-progress: true
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      ORG: climatepolicyradar
      PROJECT: frontend
      IS_WORKFLOW_CALL: ${{ needs.setup.outputs.is_workflow_call }}
      PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
    strategy:
      matrix:
        theme: ${{ fromJson(needs.setup.outputs.themes) }}
    outputs:
      review_url: ${{ steps.fetch_url.outputs.review_url }}
    steps:
      - name: Check if deploy:dev label is present
        id: label_check
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          HAS_LABEL="false"
          for label in $(echo "$LABELS_JSON" | jq -r '.[]'); do
            if [ "$label" = "deploy:dev" ]; then
              HAS_LABEL="true"
              break
            fi
          done
          echo "has_label=$HAS_LABEL" >> "$GITHUB_OUTPUT"

      - name: Determine action
        id: decide
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HAS_LABEL: ${{ steps.label_check.outputs.has_label }}
          THEME: ${{matrix.theme}}
        run: |
          action="none"

          if [ "$IS_WORKFLOW_CALL" = "true" ]; then
            # Direct invocation (e.g. test-redirects.yml): always (re)deploy
            # the given theme, regardless of deploy:dev label state.
            action="update"
          elif [ "$EVENT_ACTION" = "closed" ]; then
            action="destroy"
          elif [ "$HAS_LABEL" = "true" ]; then
            if [ "$EVENT_ACTION" = "labeled" ] || \
               [ "$EVENT_ACTION" = "synchronize" ]; then
              action="update"
            fi
          elif [ "$EVENT_ACTION" = "unlabeled" ]; then
            action="destroy"
          fi

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "stack_name=pr-${THEME}-navigator-frontend-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.decide.outputs.action == 'update'
        uses: actions/checkout@v7

      - name: Install pulumi CLI
        if: steps.decide.outputs.action != 'none'
        uses: pulumi/actions@v7

      - name: Create ${{matrix.theme}} stack (if needed)
        if: steps.decide.outputs.action == 'update'
        working-directory: infra
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
        run: |
          if ! pulumi stack init "${ORG}/${PROJECT}/${STACK_NAME}" 2>/tmp/init.err; then
            grep -q "already exists" /tmp/init.err || { cat /tmp/init.err; exit 1; }
            echo "Stack ${STACK_NAME} already exists"
          fi

      # Settings persist per stack, so the branch and the API_URL override that
      # use-search-api.yml writes both survive every later deployment without
      # being re-applied here.
      - name: Configure ${{matrix.theme}} stack deployment settings
        if: steps.decide.outputs.action == 'update'
        working-directory: infra
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
          GITHUB_INSTALLATION_ID: ${{secrets.PULUMI_INTEGRATION_ID}}
          THEME: ${{matrix.theme}}
          BRANCH: ${{ github.head_ref }}
        run: |
          pulumi deployment settings edit \
            --stack "${ORG}/${PROJECT}/${STACK_NAME}" \
            --vcs-provider github \
            --repo "${{ github.repository }}" \
            --installation-id "${GITHUB_INSTALLATION_ID}" \
            --branch "refs/heads/${BRANCH}" \
            --folder infra \
            --skip-intermediate-deployments \
            --delete-after-destroy \
            --pre-run-command "pulumi config env add ${PROJECT}/${THEME}-review --yes --stack ${ORG}/${PROJECT}/${STACK_NAME} || true" \
            --pre-run-command "pulumi config cp -d ${ORG}/${PROJECT}/${STACK_NAME} -s ${ORG}/${PROJECT}/${THEME}-review; echo \"DEBUG: config after cp:\"; pulumi config --stack ${ORG}/${PROJECT}/${STACK_NAME}"

      # --suppress-stream-logs=false makes this block until the job finishes
      # and exit non-zero if it failed. Never add --pre-run-command here: it
      # replaces the saved list rather than appending, stripping `config cp`.
      - name: Deploy ${{matrix.theme}}
        id: deploy
        if: steps.decide.outputs.action == 'update'
        working-directory: infra
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
          LOG: /tmp/deploy-${{ matrix.theme }}.log
        run: |
          set +e
          pulumi deployment run update \
            --stack "${ORG}/${PROJECT}/${STACK_NAME}" \
            --suppress-stream-logs=false \
            --color never 2>&1 | tee "$LOG"

          status=${PIPESTATUS[0]}
          console_url=$(grep -o 'https://app\.pulumi\.com/[^[:space:]]*' "$LOG" | head -1)
          echo "console_url=${console_url}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Fetch ${{matrix.theme}} review stack URL
        id: fetch_url
        if: steps.deploy.outcome == 'success'
        working-directory: infra
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
        run: |
          review_url=$(pulumi stack output ecs_service_url --stack "${ORG}/${PROJECT}/${STACK_NAME}")
          if [ -z "$review_url" ]; then
            echo "ecs_service_url stack output was empty"
            exit 1
          fi
          echo "review_url=$review_url" >> "$GITHUB_OUTPUT"

      - name: Post ${{matrix.theme}} review stack URL to PR
        if: steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          THEME: ${{ matrix.theme }}
          REVIEW_URL: ${{ steps.fetch_url.outputs.review_url }}
          CONSOLE_URL: ${{ steps.deploy.outputs.console_url }}
        run: |
          marker="<!-- review-stack-url:${THEME} -->"
          body="${marker}"$'\n'"**${THEME}** review stack: ${REVIEW_URL}"$'\n\n'"[Deployment logs](${CONSOLE_URL})"

          existing_comment_id=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate | jq -s "[.[][] | select(.body | startswith(\"${marker}\"))][0].id")

          if [ -n "$existing_comment_id" ] && [ "$existing_comment_id" != "null" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${existing_comment_id}" \
              -f body="$body"
            echo "Updated existing comment ${existing_comment_id} for theme ${THEME}"
          else
            gh api \
              --method POST \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$body"
            echo "Created new comment for theme ${THEME}"
          fi

      # main, not the settings branch, which is often deleted on merge.
      - name: Destroy ${{matrix.theme}} stack
        if: steps.decide.outputs.action == 'destroy'
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
        run: |
          set +e
          pulumi deployment run destroy \
            --stack "${ORG}/${PROJECT}/${STACK_NAME}" \
            --git-branch main \
            --suppress-stream-logs=false \
            --color never 2>&1 | tee /tmp/destroy.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ] && grep -q "no stack named" /tmp/destroy.log; then
            echo "Stack ${STACK_NAME} does not exist, nothing to destroy"
            exit 0
          fi
          exit "$status"
